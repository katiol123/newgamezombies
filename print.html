<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Print &amp; Play — Dead Block</title>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=PT+Sans+Narrow:wght@400;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { overflow: auto; background: #555; height: auto; }
    body { padding: 20px; }
    .toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 10px; margin: -20px -20px 20px; background: #1d1712; color: var(--paper); font-family: var(--font-t); }
    .toolbar b { font-family: var(--font-d); }
    .sheet { width: 210mm; min-height: 297mm; margin: 0 auto 20px; background: #fff; padding: 8mm; box-shadow: 0 10px 30px rgba(0,0,0,.5); page-break-after: always; break-after: page; position: relative; }
    .sheet h2 { font-family: var(--font-d); margin: 0 0 4mm; font-size: 16pt; color: #1d1712; }
    .sheet .note { font-family: var(--font-t); color: #555; font-size: 10pt; margin-bottom: 3mm; }
    .grid { display: flex; flex-wrap: wrap; gap: 0; }
    .slot { width: 63mm; height: 88mm; position: relative; outline: 1px dashed #aaa; outline-offset: -0.5px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .slot .card { --card-w: 146px; --card-h: 206px; zoom: 1.64; box-shadow: none; border-radius: 0; }
    .slot .count { position: absolute; right: 1mm; bottom: 1mm; font: 700 7pt var(--font-t); background: #fff; padding: 0 1mm; color: #333; z-index: 5; }
    .tile-slot { width: 150mm; height: 150mm; margin: 0 auto 6mm; outline: 1px dashed #aaa; }
    .tile-slot canvas { width: 100%; height: 100%; display: block; }
    .hero-board { width: 194mm; height: 120mm; border: 1px dashed #aaa; margin-bottom: 6mm; display: grid; grid-template-columns: 1fr 70mm; gap: 3mm; padding: 3mm; }
    .hero-board .hero-card { height: 100%; flex-direction: row; }
    .hero-board .hero-card .hero-portrait { width: 48mm; height: auto; border-bottom: 0; border-right: 3px solid var(--hero); }
    .hb-tracks { font-family: var(--font-t); color: #1d1712; display: flex; flex-direction: column; gap: 3mm; }
    .hb-tracks .tr { display: flex; flex-wrap: wrap; gap: 1mm; }
    .hb-tracks .tr span { width: 8mm; height: 8mm; border: 1px solid #1d1712; display: flex; align-items: center; justify-content: center; font: 9pt var(--font-d); }
    .hb-tracks .tr span.lv { background: #f0c040; }
    .hb-tracks .tr span.w { background: #f2d0c8; }
    .tokens { display: flex; flex-wrap: wrap; gap: 2mm; }
    .tok { display: flex; flex-direction: column; align-items: center; font: 8pt var(--font-t); color: #333; }
    .tok canvas { width: 22mm; height: 22mm; }
    .tok.small canvas { width: 16mm; height: 16mm; }
    .tok.big canvas { width: 30mm; height: 30mm; }
    .tracks { display: flex; flex-direction: column; gap: 6mm; color: #1d1712; font-family: var(--font-d); }
    .tracks .row { display: flex; gap: 1.5mm; }
    .tracks .row div { width: 13mm; height: 15mm; display: flex; align-items: center; justify-content: center; font-size: 14pt; border: 2px solid #1d1712; border-radius: 2mm; }
    .wide-cards { display: flex; flex-wrap: wrap; gap: 4mm; }
    .wide-cards .cond-card, .wide-cards .scen-card { width: 88mm; }
    /* wide text cards are light: they save ink and read well on paper */
    .wide-cards .scen-card { background: #f4ecd8 !important; border-color: #8a6a2a; color: #1d1712; }
    .wide-cards .scen-card .scen-kicker { color: #8a4a10; }
    .wide-cards .scen-card .scen-name { color: #1d1712; }
    .wide-cards .scen-card .scen-brief, .wide-cards .scen-card .scen-short { color: #2a2018; }
    .wide-cards .scen-card .scen-setup { background: rgba(120,90,40,.12); color: #1d1712; }
    .wide-cards .scen-card b { color: inherit; }
    @media print {
      html, body { background: #fff !important; padding: 0; }
      .sheet { break-inside: avoid; page-break-inside: avoid; height: 297mm; overflow: hidden; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; width: auto; min-height: auto; }
      @page { size: A4; margin: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar"><b>DEAD BLOCK · Print &amp; Play</b><span>A4, 100% scale, no margins. Cards 63×88 mm, tiles 150×150 mm, tokens 22 mm.</span><button class="btn" onclick="print()">Print</button></div>
  <div id="out"></div>

<script src="src/core/core.js"></script>
<script src="src/data/base.js"></script>
<script src="src/data/cards.js"></script>
<script src="src/data/heroes.js"></script>
<script src="src/data/tiles.js"></script>
<script src="src/data/spawns.js"></script>
<script src="src/data/scenarios.js"></script>
<script src="src/data/events.js"></script>
  <script src="src/data/missions.js"></script>
<script src="src/data/campaign.js"></script>
<script src="src/data/levels.js"></script>
<script src="src/engine/board.js"></script>
<script src="src/render/art.js"></script>
<script src="src/render/tilerender.js"></script>
<script src="src/render/cardview.js"></script>
<script>
(function () {
  const ZG = window.ZG, CV = ZG.CardView;
  const out = document.getElementById('out');
  const lvl = ZG.Levels.get('outskirts');
  const MM = 96 / 25.4;

  function sheet(title, note) {
    const s = document.createElement('div');
    s.className = 'sheet';
    s.innerHTML = `<h2>${title}</h2>` + (note ? `<div class="note">${note}</div>` : '');
    out.appendChild(s);
    return s;
  }
  // cards, 9 per sheet
  // each copy is printed separately
  function cardSheets(title, list) {
    const items = [];
    list.forEach((it) => { for (let k = 0; k < (it.count || 1); k++) items.push({ el: k ? it.el.cloneNode(true) : it.el }); });
    for (let i = 0; i < items.length; i += 9) {
      const s = sheet(title + (items.length > 9 ? ` (${i / 9 + 1})` : ''), 'Cut along the dashed lines. Card backs are on the last sheets.');
      const grid = document.createElement('div'); grid.className = 'grid';
      items.slice(i, i + 9).forEach((it) => {
        const slot = document.createElement('div'); slot.className = 'slot';
        slot.appendChild(it.el);
        grid.appendChild(slot);
      });
      s.appendChild(grid);
    }
  }
  function canvasOf(key, mm, opts) {
    const px = Math.round(mm * MM * 3);
    const c = document.createElement('canvas'); c.width = px; c.height = px;
    ZG.Art.draw(c.getContext('2d'), key, 0, 0, px, px, opts || {});
    return c;
  }

  // ---------------------------------------------- starter and signature cards
  const starter = {};
  ZG.Heroes.visible()[0].deck.slice(0, 6).forEach((id) => { starter[id] = (starter[id] || 0) + 1; });
  const nHeroes = ZG.Heroes.visible().length;
  cardSheets('Starter cards (shared)', Object.entries(starter).map(([id, n]) => ({ el: CV.card(id), count: n * nHeroes })));
  const heroCards = [];
  ZG.Heroes.visible().forEach((h) => h.deck.slice(6).forEach((id) => heroCards.push({ el: CV.card(id), count: 1 })));
  cardSheets('Hero signature cards', heroCards);
  cardSheets('Loot deck', Object.entries(lvl.loot).map(([id, n]) => ({ el: CV.card(id), count: n })));
  cardSheets('Wounds, Infections and cargo', [
    { el: CV.card('wound'), count: 30 }, { el: CV.card('infection'), count: 12 },
    { el: CV.card('cargo_fuel'), count: 2 }, { el: CV.card('cargo_meds'), count: 4 }, { el: CV.card('cargo_radio'), count: 1 },
  ]);
  cardSheets('Spawn cards', Object.entries(lvl.spawnDeck).map(([id, n]) => ({ el: CV.spawnCard(id), count: n })));

  // ------------------------------------------------- objectives and conditions
  // wide cards (88 mm), 6 per sheet
  const wideSheets = (title, els) => {
    for (let i = 0; i < els.length; i += 6) {
      const sc = sheet(title + (els.length > 6 ? ` (${i / 6 + 1})` : ''));
      const wc = document.createElement('div'); wc.className = 'wide-cards';
      els.slice(i, i + 6).forEach((e) => wc.appendChild(e));
      sc.appendChild(wc);
    }
  };
  wideSheets('Objectives', lvl.scenarios.map((id) => CV.scenarioCard(id)));
  wideSheets('Game conditions', lvl.conditions.map((id) => CV.conditionCard(id)));
  wideSheets('Round events', lvl.events.map((id) => CV.eventCard(id)));
  wideSheets('Secret missions', ZG.MISSION_DECK.map((id) => CV.missionCard(id)));
  wideSheets('Bonus objectives', lvl.bonuses.map((id) => { const b = ZG.Bonuses.get(id); const d = document.createElement('div'); d.className = 'scen-card'; d.innerHTML = `<div class="scen-kicker">BONUS OBJECTIVE ★</div><div class="scen-name">${b.name}</div><div class="scen-brief">${b.text}</div>${b.track ? `<div class="scen-setup">${b.track}</div>` : ''}`; return d; }));

  // shelter events (campaign): 8 events + 8 blanks; shuffle and draw one card after each mission
  if (ZG.SHELTER_EVENTS) {
    const evEls = ZG.SHELTER_EVENTS.map((d) => { const e = document.createElement('div'); e.className = 'scen-card'; e.innerHTML = `<div class="scen-kicker">SHELTER EVENT</div><div class="scen-name">${d.name}</div><div class="scen-brief">${d.text}</div>`; return e; })
      .concat((ZG.SHELTER_BLANKS || []).map((t) => { const e = document.createElement('div'); e.className = 'scen-card'; e.innerHTML = `<div class="scen-kicker">SHELTER EVENT</div><div class="scen-name">A quiet night</div><div class="scen-brief">${t}</div><div class="scen-setup">Nothing happens.</div>`; return e; }));
    wideSheets('Campaign: shelter events (shuffle; 1 card after each mission)', evEls);
  }
  // campaign story events: cut, turn face down and do not read ahead — they are drawn when the condition on the card is met
  const plots = ZG.Scenarios.all().filter((d) => d.plotCard).map((d) => CV.plotCard(d.id));
  if (plots.length) {
    const sp = sheet('Campaign: story events', 'DO NOT READ AHEAD. Cut out and stack face down — a card is drawn when its “When” condition is met.');
    const wc = document.createElement('div'); wc.className = 'wide-cards'; plots.forEach((e) => wc.appendChild(e)); sp.appendChild(wc);
  }

  // ---------------------------------------------------- hero boards
  const heroes = ZG.Heroes.visible();
  for (let i = 0; i < heroes.length; i += 2) {
    const s = sheet('Hero boards', 'Track experience and Wounds with a die or a token.');
    heroes.slice(i, i + 2).forEach((h) => {
      const b = document.createElement('div'); b.className = 'hero-board';
      b.appendChild(CV.heroCard(h.id, { talents: true, bio: true }));
      b.appendChild(boardTracks(h));
      s.appendChild(b);
    });
  }
  // experience and Wound tracks next to the hero card
  function boardTracks(h) {
      const tr = document.createElement('div'); tr.className = 'hb-tracks';
      let xp = '<div><b>Experience 🎖</b></div><div class="tr">';
      for (let k = 0; k <= 12; k++) xp += `<span class="${k === 4 || k === 10 ? 'lv' : ''}">${k}</span>`;
      xp += '</div><div><b>Wounds (Grit ' + h.hp + ')</b></div><div class="tr">';
      for (let k = 1; k <= h.hp + (h.talents.flat().includes('thick_skin') ? 2 : 0); k++) xp += `<span class="${k <= h.hp ? 'w' : ''}">${k}</span>`;
      xp += `</div><div style="font-size:9pt">Yellow boxes mean a new level: choose a talent.${h.talents.flat().includes('thick_skin') ? ' Boxes beyond Grit are for the “Thick Skin” talent.' : ''}</div>`;
      tr.innerHTML = xp;
      return tr;
  }

  // -------------------------------------------- tile back (fog)
  const tb = sheet('Tile back (print on the reverse of each tile)', '150×150 mm. For “Fog of War” mode.');
  const backC = document.createElement('canvas'); const BS = Math.round(150 * MM * 2); backC.width = BS; backC.height = BS;
  (function (c) {
    const gr = c.createLinearGradient(0, 0, BS, BS); gr.addColorStop(0, '#2b211a'); gr.addColorStop(1, '#1a1410'); c.fillStyle = gr; c.fillRect(0, 0, BS, BS);
    c.strokeStyle = 'rgba(224,168,58,.08)'; c.lineWidth = BS / 40; for (let i = -BS; i < BS * 2; i += BS / 9) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i - BS, BS); c.stroke(); }
    c.strokeStyle = 'rgba(224,168,58,.5)'; c.lineWidth = 4; c.setLineDash([24, 14]); c.strokeRect(20, 20, BS - 40, BS - 40); c.setLineDash([]);
    c.fillStyle = 'rgba(232,220,192,.25)'; c.font = `${BS / 3}px 'Russo One', sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('?', BS / 2, BS / 2 - BS / 20);
    c.fillStyle = 'rgba(232,220,192,.7)'; c.font = `${BS / 22}px 'Russo One', sans-serif`; c.fillText('UNEXPLORED', BS / 2, BS * 0.78);
  })(backC.getContext('2d'));
  const tbs = document.createElement('div'); tbs.className = 'tile-slot'; tbs.appendChild(backC); tb.appendChild(tbs);

  // ----------------------------------------------------------- tiles
  lvl.tiles.forEach((id) => {
    const def = ZG.Tiles.get(id);
    const s = sheet(`Tile ${def.num} — ${def.name}`, '150×150 mm. Can be glued onto 2 mm card stock.');
    const board = ZG.Board.fromPlaced([{ id, rot: 0, tx: 0, ty: 0 }], 1, 1);
    const C = 50 * MM * 2;
    const cv = document.createElement('canvas');
    cv.width = Math.round(C * 3); cv.height = Math.round(C * 3);
    const ctx = cv.getContext('2d');
    ZG.TileRender.drawBoard(ctx, board, 0, C, { noFrame: true, labels: true, printSearch: true });
    const slot = document.createElement('div'); slot.className = 'tile-slot';
    slot.appendChild(cv); s.appendChild(slot);
  });

  // ---------------------------------------------------------- tokens
  // tokens move to a new sheet when the current one is full (estimated by area)
  let tw = null, used = 0, tokSheets = 0;
  const CAP = 52;
  const newTokSheet = () => {
    tokSheets++;
    const ts = sheet('Tokens' + (tokSheets > 1 ? ` (${tokSheets})` : ''), 'Cut along the outline. Numbers show how many you need.');
    tw = document.createElement('div'); tw.className = 'tokens'; ts.appendChild(tw); used = 0;
  };
  newTokSheet();
  const tok = (key, n, label, cls, opts) => {
    for (let i = 0; i < n; i++) {
      const cost = cls === 'big' ? 1.9 : cls === 'small' ? 0.55 : 1;
      if (used + cost > CAP) newTokSheet();
      used += cost;
      const d = document.createElement('div'); d.className = 'tok ' + (cls || '');
      d.appendChild(canvasOf(key, cls === 'big' ? 30 : cls === 'small' ? 16 : 22, opts));
      if (i === 0) d.appendChild(Object.assign(document.createElement('span'), { textContent: `${label} ×${n}` }));
      tw.appendChild(d);
    }
  };
  const pool = lvl.pool || {};
  tok('z_walker', pool.walker || 24, 'Shambler'); tok('z_runner', pool.runner || 8, 'Runner'); tok('z_fatso', pool.fatso || 5, 'Bloater'); tok('z_screamer', pool.screamer || 4, 'Screamer');
  tok('z_brute', pool.brute || 2, 'Brute', 'big'); tok('z_plague', pool.plague || 3, 'Plaguebearer'); tok('z_grabber', pool.grabber || 3, 'Grabber'); tok('z_hound', 1, 'Hound', 'big'); tok('tok_zback', 1, 'Zombie token back (print on the reverse of all)'); tok('z_nest', 3, 'Nest', 'big', { t: 0 });
  // hero pawn: the front is the hero, the back is the same hero turned (print double-sided)
  ZG.Heroes.visible().forEach((h) => { tok(h.art, 1, h.name); tok('z_turned_' + h.id, 1, `${ZG.Zombies.get('turned_' + h.id).name} (pawn back)`, 'big'); });
  tok('tok_spawn', 4, 'Manhole'); tok('tok_crate', 5, 'Crate'); tok('tok_search', 12, 'Search', 'small'); tok('tok_search', 1, 'Armory', 'small', { armory: true });
  tok('tok_trap', 3, 'Tripwire', 'small'); tok('tok_lure', 2, 'Lure', 'small'); tok('noiseIcon', 8, 'Noise', 'small'); tok('shieldIcon', 8, 'Block', 'small');
  tok('energy', 6, 'Adrenaline', 'small'); tok('skull', 8, 'Damage (large targets)', 'small', { color: '#e8a090' });
  tok('tok_crate', 5, 'Crate (back)');
  tok('cargo_fuel', 2, 'Crate: jerrycan', '', { noBg: true }); tok('cargo_meds', 4, 'Crate: medicine', '', { noBg: true }); tok('cargo_radio', 1, 'Crate: radio', '', { noBg: true }); tok('tok_crate', 3, 'Crate: empty', '', { opened: true });
tok('tok_door', 18, 'Door (closed)', 'small'); tok('tok_door', 1, 'Back: open (print on the reverse)', 'small', { open: true });
  tok('tok_plug', 4, 'Manhole plug', 'small', { n: 2 }); tok('tok_decoy', 17, 'Decoy “Gone”', 'small', { kind: 'gone' }); tok('tok_decoy', 1, '“Lair”', 'small', { kind: 'lair' }); tok('tok_decoy', 1, '“Ambush from above”', 'small', { kind: 'ambush' }); tok('tok_decoy', 1, '“Tracks”', 'small', { kind: 'tracks' });
    tok('tok_hunt', 20, 'Hunting (“!”)', 'small'); tok('tok_trail', 10, 'Last trail (“?”)', 'small');
  tok('tok_barricade', 4, 'Barricade', 'big'); tok('tok_round', 1, 'Round marker', 'small'); tok('tok_alarm', 1, 'Alarm marker', 'small'); tok('tok_start', 1, 'Start', 'small');
  tok('exit_car', 1, 'Car', 'big'); tok('exit_ambulance', 1, 'Ambulance', 'big'); tok('exit_heli', 1, 'Helicopter', 'big'); tok('tok_tower', 1, 'Tower', 'big');

  // ------------------------------------------------ campaign: enemy tokens, safe, exits
  const campZ = ['bear', 'forester', 'guard', 'sniper', 'bandit', 'raider', 'bride', 'butcher'].filter((id) => ZG.Zombies.has(id));
  const campN = { bandit: 4, raider: 10, sniper: 2, guard: 1 };
  campZ.forEach((id) => { const d = ZG.Zombies.get(id); tok(d.art, campN[id] || 1, `Campaign: ${d.name}`, d.big || d.boss ? 'big' : ''); });
  tok('tok_safe', 1, 'Campaign: safe', 'big');
  tok('valuable', 4, 'Safe stack: “Valuable” (face down)', 'small'); tok('tok_decoy', 1, 'Safe stack: “Empty”', 'small', { kind: 'gone' }); tok('noiseIcon', 1, 'Safe stack: “Siren” (Noise 3)', 'small');
  ['exit_van'].forEach((k) => tok(k, 1, 'Campaign: the van', 'big'));

  // ---------------------------------------------------- campaign: tiles
  ZG.Tiles.all().filter((t) => t.unique).forEach((def) => {
    const s = sheet(`Campaign · tile ${def.num} — ${def.name}`, '150×150 mm. A unique campaign tile: not part of the shared pool; the mission places it.');
    const board = ZG.Board.fromPlaced([{ id: def.id, rot: 0, tx: 0, ty: 0 }], 1, 1);
    const C = 50 * MM * 2;
    const cv = document.createElement('canvas');
    cv.width = Math.round(C * 3); cv.height = Math.round(C * 3);
    ZG.TileRender.drawBoard(cv.getContext('2d'), board, 0, C, { noFrame: true, labels: true, printSearch: true });
    const slot = document.createElement('div'); slot.className = 'tile-slot';
    slot.appendChild(cv); s.appendChild(slot);
  });

  // ---------------------------------------------------- campaign: cards
  const inBase = new Set(Object.keys(lvl.loot));
  const campCount = { valuable: 12, bride_wail: 8, despair: 8, courage: 4, hunt_double: 2 }; // Valuables: up to 4 per safe, one safe each in M2, M7, M8
  const campCards = ZG.Cards.all().filter((d) => !inBase.has(d.id) && d.kind !== 'wound' && d.kind !== 'infection' && !['cargo_fuel', 'cargo_meds', 'cargo_radio'].includes(d.id)
    && (d.campaignOnly || d.kind === 'cargo' || d.kind === 'junk' || d.kind === 'temp' || d.trophy || d.loot || d.trader) && !ZG.Heroes.all().some((h) => h.deck.includes(d.id)));
  cardSheets('Campaign: cards (cargo, trophies, mission finds, trader goods, Valuables)', campCards.map((d) => ({ el: CV.card(d.id), count: campCount[d.id] || (d.trader ? 3 : 1) })));
  // campaign mission objectives, with the special rules from the chain
  const chainCards = ZG.CAMPAIGN.chain.map((m, i) => ({ m, i })).filter(({ m }) => m.scenarioId && ZG.Scenarios.get(m.scenarioId).campaignOnly).map(({ m, i }) => {
    const el = CV.scenarioCard(m.scenarioId);
    el.querySelector('.scen-kicker').textContent = `MISSION ${i + 1} · ${m.name.toUpperCase()}`;
    if (m.special && m.special.length) { const d = document.createElement('div'); d.className = 'scen-setup'; d.innerHTML = '<b>⚠ Special rules:</b> ' + m.special.join(' ') ; el.appendChild(d); }
    return el;
  });
  if (chainCards.length) { for (let i = 0; i < chainCards.length; i += 2) { const sc = sheet('Campaign: mission objectives', 'Wide cards, 2 per sheet: the campaign has long setup texts.'); const wc = document.createElement('div'); wc.className = 'wide-cards'; chainCards.slice(i, i + 2).forEach((e) => wc.appendChild(e)); sc.appendChild(wc); } }
  // the secret hero gets a separate sheet: do not open until rescued
  const secret = ZG.Heroes.all().filter((h) => h.secret);
  secret.forEach((h) => {
    const s2 = sheet(`Campaign: secret hero — ${h.name} (do not open until rescued)`, 'Board, pawn, pawn back and signature cards.');
    const b = document.createElement('div'); b.className = 'hero-board';
    b.appendChild(CV.heroCard(h.id, { talents: true, bio: true }));
    const tw2 = document.createElement('div'); tw2.className = 'tokens';
    [[h.art, h.name], ['z_turned_' + h.id, (ZG.Zombies.has('turned_' + h.id) ? ZG.Zombies.get('turned_' + h.id).name : 'Turned') + ' (back)']].forEach(([k, label]) => { const d = document.createElement('div'); d.className = 'tok big'; d.appendChild(canvasOf(k, 30)); d.appendChild(Object.assign(document.createElement('span'), { textContent: label })); tw2.appendChild(d); });
    const side = boardTracks(h); side.appendChild(tw2); b.appendChild(side); s2.appendChild(b);
    cardSheets(`Campaign: signature cards — ${h.name}`, h.deck.slice(6).map((id) => ({ el: CV.card(id), count: 1 })));
  });
  const campSpawn = Array.from(new Set(ZG.Levels.all().filter((l) => l.campaignOnly).flatMap((l) => Object.keys(l.spawnDeck || {})))).filter((id) => !lvl.spawnDeck[id]);
  if (campSpawn.length) cardSheets('Campaign: mission spawn cards', campSpawn.map((id) => ({ el: CV.spawnCard(id), count: 1 })));

  // ----------------------------------------------------- track board
  const tk = sheet('Track board');
  const trk = document.createElement('div'); trk.className = 'tracks';
  let html = '<div>ROUND</div><div class="row">';
  for (let r = 1; r <= lvl.rounds; r++) { const ph = r >= lvl.phaseStarts[2] ? 2 : r >= lvl.phaseStarts[1] ? 1 : 0; html += `<div style="background:${ZG.PHASES[ph].color}">${r}</div>`; }
  html += '</div><div style="font: 11pt var(--font-t)">Dusk → Night → Dead of Night (zombies +1 speed). After the last round — defeat.</div>';
  html += '<div>ALARM</div><div class="row">';
  for (let a = 0; a <= 11; a++) html += `<div style="background:${a >= 6 ? '#f2b0a0' : a >= 3 ? '#f8dccf' : '#fff'}">${a}</div>`;
  html += `</div><div style="font: 11pt var(--font-t)">Wave threshold: solo and two heroes — 5, three — 6, four — 4. In the “Spawn” step: subtract the threshold and draw an extra card for each manhole.</div>`;
  html += '<div>BONUS OBJECTIVE COUNTER</div><div class="row" style="flex-wrap:wrap">';
  for (let a = 0; a <= 24; a++) html += `<div style="width:7mm;height:10mm;font-size:10pt">${a}</div>`;
  html += '</div>';
  html += '<div>ZOMBIE PHASE ORDER</div><div style="font: 12pt var(--font-t)">1. Move → 2. Attack → 3. Special abilities → 4. Spawn (+Wave) → 5. End of round</div>';
  trk.innerHTML = html;
  tk.appendChild(trk);

  // ------------------------------------------------------------ reference card
  const ref = sheet('Reference card (2 copies)');
  for (let k = 0; k < 2; k++) {
    const d = document.createElement('div');
    d.style.cssText = 'border:1px dashed #aaa;padding:5mm;margin-bottom:5mm;font:11pt var(--font-t);color:#1d1712;columns:2;column-gap:8mm';
    d.innerHTML = `<b style="font:13pt var(--font-d)">ROUND</b><br>1. Hero turns (any order)<br>2. Zombie phase: move → attack → abilities (Horde: +1 Alarm per 8 zombies) → spawn (+Wave)<br>3. End of round: clear damage, noise, lures; advance the round<br><br>
      <b style="font:13pt var(--font-d)">HERO TURN</b><br>Draw up to the limit (max. 3) → 3 ⚡ → act. Cards in hand are shields.<br>Chain: the same suit in a row. Relay: the first card continues the previous hero's suit.<br>Grip: leaving a zone with zombies +1 ⚡.<br><br>
      <b style="font:13pt var(--font-d)">BASIC ACTIONS</b><br>Move 1 · Search 1 (2 loot, keep 1) · Punch 1 · Barricade 2 · Pick Up 1 · Give 0 · Catch Breath 3<br><br>
      <b style="font:13pt var(--font-d)">ZOMBIES</b><br>Head for the nearest target: lure → noise → fewest Wounds. Attack: block → gear → shields → Wounds to discard.<br>Dead of Night: +1 speed. Experience: 4 🎖 and 10 🎖 — a talent.`;
    ref.appendChild(d);
  }

  // ---------------------------------------------------------- card backs
  cardSheets('Card backs: actions', Array.from({ length: 9 }, () => ({ el: CV.cardBack('hero') })));
  cardSheets('Card backs: loot', Array.from({ length: 9 }, () => ({ el: CV.cardBack('loot') })));
  cardSheets('Card backs: spawn', Array.from({ length: 9 }, () => ({ el: CV.cardBack('spawn') })));
  requestAnimationFrame(() => document.querySelectorAll('.slot .card').forEach((c) => CV.fit(c)));
})();
</script>
</body>
</html>
